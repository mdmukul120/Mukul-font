name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Universal APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Prepare Environment Files
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Prepare Debug Keystore for CI
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew 2>/dev/null || true

      - name: Build Debug & Universal APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Rename and Prepare APK for Distribution
        id: apk_prep
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found"
            exit 1
          fi
          VERSION_TAG="${{ github.ref_name }}"
          if [[ ! "$VERSION_TAG" =~ ^v ]]; then
            VERSION_TAG="latest"
          fi
          RELEASE_APK_NAME="Mukul-Font-${VERSION_TAG}-Universal.apk"
          cp "$APK_PATH" "$RELEASE_APK_NAME"
          echo "apk_path=$RELEASE_APK_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$RELEASE_APK_NAME" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mukul-Font-Universal-APK
          path: ${{ steps.apk_prep.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk_prep.outputs.apk_path }}
          name: "Mukul Font Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 🚀 Mukul Font Universal Android APK
            
            **Download & Installation Instructions:**
            1. Download the attached `${{ steps.apk_prep.outputs.apk_name }}` below.
            2. Open the downloaded file on your Android device.
            3. If prompted, allow "Install from unknown sources" or "Install unknown apps" in Settings.
            4. Enjoy custom fonts on Xiaomi, Samsung, OnePlus, Vivo, Pixel, and all Android devices!
            
            #### Features:
            - 🔤 Rich Bengali & Global Font Library (Kalpurush, Hind Siliguri, Poppins, Galada, Orbitron, Pacifico)
            - 🌐 Google Fonts Search & Direct Downloader
            - 📱 Multi-OEM Support (Samsung OneUI, Xiaomi MIUI/HyperOS, OnePlus/Oppo ColorOS, Vivo)
            - ⚡ Instant In-App Font Engine & Magisk Flashable Root Module Generator
            - 🎨 Interactive Font Playground & Glyph Map
